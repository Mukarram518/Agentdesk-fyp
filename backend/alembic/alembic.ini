# A generic, single database configuration for AgentDesk.

[alembic]
# path to migration scripts (here refers to backend/alembic)
script_location = %(here)s

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# prepend backend directory to sys.path
prepend_sys_path = %(here)s/..
version_path_separator = os
path_separator = os

# timezone for migration timestamps
timezone = UTC

# sqlalchemy.url is dynamically loaded from app.core.config in env.py
sqlalchemy.url = 

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
